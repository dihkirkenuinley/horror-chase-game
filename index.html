<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Femboy Maze Horror - Constant Patrol</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; font-family: monospace; color: white; }
    canvas { display: block; margin: 20px auto; image-rendering: pixelated; background: #080808; border: 4px solid #ff4fd8; }
    #ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 18px; text-shadow: 0 0 6px #ff4fd8; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui">
    <div>FEMBOY MAZE HORROR</div>
    <div>WASD to Move</div>
    <div style="color: #ff77d8;">They never stop moving... keep pushing forward!</div>
  </div>
  <canvas id="game" width="960" height="640"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const TILE = 32; const ROWS = 20; const COLS = 30;
    const maze = [];

    // Maze Generation
    for (let y = 0; y < ROWS; y++) {
      maze[y] = [];
      for (let x = 0; x < COLS; x++) maze[y][x] = 1;
    }

    function carve(x, y) {
      const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(() => Math.random() - 0.5);
      maze[y][x] = 0;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && ny > 0 && nx < COLS - 1 && ny < ROWS - 1 && maze[ny][nx] === 1) {
          maze[y + dy / 2][x + dx / 2] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(1, 1);

    // Start and Exit zones
    for (let y = 1; y < 4; y++) for (let x = 1; x < 4; x++) maze[y][x] = 0;
    maze[ROWS - 2][COLS - 2] = 2; maze[ROWS - 2][COLS - 3] = 0; maze[ROWS - 3][COLS - 2] = 0;

    const player = { x: TILE * 1.5, y: TILE * 1.5, speed: 2.4 };
    const keys = {};
    let ended = false;

    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function getRandomFloor() {
        let rx, ry;
        do {
            rx = Math.floor(Math.random() * COLS);
            ry = Math.floor(Math.random() * ROWS);
        } while (maze[ry][rx] !== 0);
        return { x: rx * TILE + TILE/2, y: ry * TILE + TILE/2 };
    }

    function makeEnemy(x, y, color, hair) {
      const target = getRandomFloor();
      return { 
        x, y, speed: 1.3, color, hair, 
        targetX: target.x, targetY: target.y,
        state: 'roaming',
        timer: 0 
      };
    }

    const enemies = [
      makeEnemy(25 * TILE, 16 * TILE, '#ff77d8', '#74f0ff'),
      makeEnemy(20 * TILE, 10 * TILE, '#c58cff', '#ffef73'),
      makeEnemy(10 * TILE, 17 * TILE, '#ff99c8', '#ffffff')
    ];

    function getTile(x, y) {
      const tx = Math.floor(x / TILE);
      const ty = Math.floor(y / TILE);
      if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return 1;
      return maze[ty][tx];
    }

    function hasLineOfSight(x1, y1, x2, y2) {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const step = 8;
      const dx = (x2 - x1) / dist;
      const dy = (y2 - y1) / dist;
      for (let i = 0; i < dist; i += step) {
        if (getTile(x1 + dx * i, y1 + dy * i) === 1) return false;
      }
      return true;
    }

    function update() {
      if (ended) return;

      // Player Movement
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= player.speed;
      if (keys['s'] || keys['arrowdown']) dy += player.speed;
      if (keys['a'] || keys['arrowleft']) dx -= player.speed;
      if (keys['d'] || keys['arrowright']) dx += player.speed;

      if (getTile(player.x + dx, player.y) !== 1) player.x += dx;
      if (getTile(player.x, player.y + dy) !== 1) player.y += dy;
      if (getTile(player.x, player.y) === 2) gameOver(true);

      // Enemy AI
      enemies.forEach(e => {
        const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
        const distToTarget = Math.hypot(e.targetX - e.x, e.targetY - e.y);
        
        // If they see you, chase you
        if (hasLineOfSight(e.x, e.y, player.x, player.y)) {
          e.state = 'chasing';
          e.targetX = player.x;
          e.targetY = player.y;
        } else {
          // If roaming and reached target, OR stuck for 5 seconds, pick NEW target
          e.timer++;
          if (distToTarget < 10 || e.timer > 300) { 
            const newSpot = getRandomFloor();
            e.targetX = newSpot.x;
            e.targetY = newSpot.y;
            e.state = 'roaming';
            e.timer = 0;
          }
        }

        const angle = Math.atan2(e.targetY - e.y, e.targetX - e.x);
        const vx = Math.cos(angle) * e.speed;
        const vy = Math.sin(angle) * e.speed;

        // Sliding collision logic
        if (getTile(e.x + vx, e.y) !== 1) e.x += vx;
        if (getTile(e.x, e.y + vy) !== 1) e.y += vy;

        if (distToPlayer < 20) gameOver(false);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (maze[y][x] === 1) { 
            ctx.fillStyle = '#1a1a1a'; 
            ctx.fillRect(x * TILE, y * TILE, TILE, TILE); 
          } else if (maze[y][x] === 2) { 
            ctx.fillStyle = '#00ff99'; 
            ctx.fillRect(x * TILE + 4, y * TILE + 4, TILE - 8, TILE - 8); 
          }
        }
      }

      enemies.forEach(e => {
        const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
        if (distToPlayer < 160) {
          ctx.fillStyle = e.hair; ctx.fillRect(e.x - 10, e.y - 15, 20, 10);
          ctx.fillStyle = '#ffd7c2'; ctx.fillRect(e.x - 8, e.y - 5, 16, 15);
          ctx.fillStyle = e.color; ctx.fillRect(e.x - 8, e.y + 10, 16, 10);
          ctx.fillStyle = 'red'; ctx.fillRect(e.x - 4, e.y, 2, 2); ctx.fillRect(e.x + 2, e.y, 2, 2);
        }
      });
      
      // Draw Player
      ctx.fillStyle = '#ffd7b5'; ctx.fillRect(player.x - 6, player.y - 15, 12, 12);
      ctx.fillStyle = '#4da6ff'; ctx.fillRect(player.x - 5, player.y - 3, 10, 10);

      // Small flashlight circle
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      const grad = ctx.createRadialGradient(player.x, player.y, 20, player.x, player.y, 160);
      grad.addColorStop(0, 'white'); grad.addColorStop(1, 'black');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function gameOver(win) {
      if (ended) return;
      ended = true;
      const msg = document.createElement('div');
      msg.style = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; color:white; text-shadow:0 0 10px #ff4fd8; text-align:center; background:rgba(0,0,0,0.8); padding:20px; border-radius:10px; z-index:100;";
      msg.innerHTML = (win ? "YOU ESCAPED!" : "THEY FOUND YOU...") + "<br><span style='font-size:20px'>Click to Restart</span>";
      document.body.appendChild(msg);
      window.onclick = () => location.reload();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
