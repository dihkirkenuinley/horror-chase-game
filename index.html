<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Femboy Maze Horror - LOS Edition</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; font-family: monospace; color: white; }
    canvas { display: block; margin: 20px auto; image-rendering: pixelated; background: #080808; border: 4px solid #ff4fd8; }
    #ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 18px; text-shadow: 0 0 6px #ff4fd8; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui">
    <div>FEMBOY MAZE HORROR</div>
    <div>WASD / Arrow Keys to Move</div>
    <div style="color: #ff77d8;">Careful... you can only see them if they have LOS!</div>
  </div>
  <canvas id="game" width="960" height="640"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const TILE = 32; const ROWS = 20; const COLS = 30;
    const maze = [];

    // Generate Maze
    for (let y = 0; y < ROWS; y++) {
      maze[y] = [];
      for (let x = 0; x < COLS; x++) maze[y][x] = 1;
    }

    function carve(x, y) {
      const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(() => Math.random() - 0.5);
      maze[y][x] = 0;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && ny > 0 && nx < COLS - 1 && ny < ROWS - 1 && maze[ny][nx] === 1) {
          maze[y + dy / 2][x + dx / 2] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(1, 1);

    // Set starting area and green exit
    for (let y = 1; y < 4; y++) for (let x = 1; x < 4; x++) maze[y][x] = 0;
    maze[ROWS - 2][COLS - 2] = 2; maze[ROWS - 2][COLS - 3] = 0; maze[ROWS - 3][COLS - 2] = 0;

    const player = { x: TILE * 1.5, y: TILE * 1.5, speed: 2.5 };
    const keys = {};
    let ended = false;

    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function makeEnemy(x, y, color, hair) {
      return { x, y, speed: 1.1 + Math.random() * 0.4, color, hair };
    }
    const enemies = [
      makeEnemy(25 * TILE, 16 * TILE, '#ff77d8', '#74f0ff'),
      makeEnemy(20 * TILE, 10 * TILE, '#c58cff', '#ffef73'),
      makeEnemy(10 * TILE, 17 * TILE, '#ff99c8', '#ffffff')
    ];

    function getTile(x, y) {
      const tx = Math.floor(x / TILE);
      const ty = Math.floor(y / TILE);
      if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return 1;
      return maze[ty][tx];
    }

    // Line of Sight function: checks if a wall is between two points
    function hasLineOfSight(x1, y1, x2, y2) {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const step = 8; // Check every 8 pixels
      const dx = (x2 - x1) / dist;
      const dy = (y2 - y1) / dist;
      for (let i = 0; i < dist; i += step) {
        if (getTile(x1 + dx * i, y1 + dy * i) === 1) return false;
      }
      return true;
    }

    function drawPlayer() {
      const isMoving = keys['w'] || keys['a'] || keys['s'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright'];
      const bob = isMoving ? Math.sin(Date.now() / 100) * 2 : 0;
      ctx.save();
      ctx.translate(player.x, player.y + bob);
      ctx.fillStyle = '#ffd7b5'; ctx.fillRect(-6, -15, 12, 12);
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(-7, -17, 14, 5);
      ctx.fillStyle = '#4da6ff'; ctx.fillRect(-5, -3, 10, 10);
      ctx.fillStyle = '#222'; ctx.fillRect(-5, 7, 4, 5); ctx.fillRect(1, 7, 4, 5);
      ctx.fillStyle = '#000'; ctx.fillRect(-3, -11, 2, 2); ctx.fillRect(1, -11, 2, 2);
      ctx.restore();
    }

    function update() {
      if (ended) return;
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= player.speed;
      if (keys['s'] || keys['arrowdown']) dy += player.speed;
      if (keys['a'] || keys['arrowleft']) dx -= player.speed;
      if (keys['d'] || keys['arrowright']) dx += player.speed;

      // Corrected movement collision (allows walking on exit tile 2)
      if (getTile(player.x + dx, player.y) !== 1) player.x += dx;
      if (getTile(player.x, player.y + dy) !== 1) player.y += dy;

      // Win Condition
      if (getTile(player.x, player.y) === 2) gameOver(true);

      enemies.forEach(e => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        const nx = e.x + Math.cos(angle) * e.speed, ny = e.y + Math.sin(angle) * e.speed;
        if (getTile(nx, e.y) !== 1) e.x = nx;
        if (getTile(e.x, ny) !== 1) e.y = ny;
        if (Math.hypot(player.x - e.x, player.y - e.y) < 18) gameOver(false);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw Maze
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (maze[y][x] === 1) { 
            ctx.fillStyle = '#1a1a1a'; 
            ctx.fillRect(x * TILE, y * TILE, TILE, TILE); 
          } else if (maze[y][x] === 2) { 
            ctx.fillStyle = '#00ff99'; 
            ctx.fillRect(x * TILE + 4, y * TILE + 4, TILE - 8, TILE - 8); 
          }
        }
      }

      // Draw Enemies ONLY if they have LOS to player
      enemies.forEach(e => {
        if (hasLineOfSight(player.x, player.y, e.x, e.y)) {
          ctx.fillStyle = e.hair; ctx.fillRect(e.x - 10, e.y - 15, 20, 10);
          ctx.fillStyle = '#ffd7c2'; ctx.fillRect(e.x - 8, e.y - 5, 16, 15);
          ctx.fillStyle = e.color; ctx.fillRect(e.x - 8, e.y + 10, 16, 10);
          ctx.fillStyle = 'red'; ctx.fillRect(e.x - 4, e.y, 2, 2); ctx.fillRect(e.x + 2, e.y, 2, 2);
        }
      });
      
      drawPlayer();

      // Flashlight effect
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      const grad = ctx.createRadialGradient(player.x, player.y, 20, player.x, player.y, 180);
      grad.addColorStop(0, 'white'); grad.addColorStop(1, 'black');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function gameOver(win) {
      ended = true;
      const msg = document.createElement('div');
      msg.style = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; color:white; text-shadow:0 0 10px #ff4fd8; text-align:center; background:rgba(0,0,0,0.8); padding:20px; border-radius:10px;";
      msg.innerHTML = (win ? "YOU ESCAPED!" : "THEY FOUND YOU...") + "<br><span style='font-size:20px'>Click to Restart</span>";
      document.body.appendChild(msg);
      window.onclick = () => location.reload();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
